# Render Blueprint for one free Docker web service.
# No database and no persistent disk. Files live in /tmp and are deleted
# as soon as they are streamed to the browser.
services:
  - type: web
    name: transkrow-fetch
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_DIR
        value: /tmp/transkrow
      - key: DELETE_AFTER_MINUTES
        value: "15"
      - key: MAX_DURATION_MINUTES
        value: "90"
      - key: MAX_FILE_BYTES
        value: 150M
      - key: MAX_DISK_BYTES
        value: 400M
      - key: MAX_CONCURRENT
        value: "1"
      - key: MAX_PLAYLIST_ITEMS
        value: "3"
      - key: JOB_TIMEOUT_MINUTES
        value: "20"
